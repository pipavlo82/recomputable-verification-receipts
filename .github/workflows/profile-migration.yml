name: Versioned profile migration candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.15.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install separate schema oracle
        run: python -m pip install jsonschema==4.26.0
      - name: Replay migration, negative controls and physical removals
        run: |
          python research/schema-string-repair/migration_campaign.py --output "$RUNNER_TEMP/migration"
          python research/schema-string-repair/migration_mutations.py --output "$RUNNER_TEMP/migration-mutations"
          python research/schema-string-repair/migration_runtime_controls.py --output "$RUNNER_TEMP/runtime-controls"
      - name: Replay repaired Unicode CLI and independent schema oracle
        run: |
          curl --fail --location https://www.unicode.org/Public/17.0.0/ucd/UnicodeData.txt --output "$RUNNER_TEMP/UnicodeData-17.txt"
          python research/schema-string-repair/unicode_data_campaign.py --output "$RUNNER_TEMP/unicode"
          python research/schema-string-repair/unicode_data_oracle.py --campaign "$RUNNER_TEMP/unicode" --ucd "$RUNNER_TEMP/UnicodeData-17.txt"
      - name: Check frozen identities and new package identities
        run: python research/schema-string-repair/migration_integrity.py
      - name: Replay repaired string and reference mutations
        run: python research/schema-string-repair/unicode_data_mutations.py --output "$RUNNER_TEMP/unicode-mutations"
      - name: Preserve raw results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-evidence
          path: |
            ${{ runner.temp }}/migration/*.json
            ${{ runner.temp }}/migration/logs/**
            ${{ runner.temp }}/migration-mutations/*.json
            ${{ runner.temp }}/migration-mutations/logs/**
            ${{ runner.temp }}/runtime-controls/*.json
            ${{ runner.temp }}/runtime-controls/logs/**
            ${{ runner.temp }}/unicode/*.json
            ${{ runner.temp }}/unicode/logs/**
            ${{ runner.temp }}/unicode-mutations/*.json
            ${{ runner.temp }}/unicode-mutations/logs/**
