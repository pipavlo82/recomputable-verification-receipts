name: RVR v0 Conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rvr-v0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Run exact Python RVR v0 gate
        run: python conformance/rvr-v0/adapter.py --check

      - name: Run exact TypeScript RVR v0 gate
        run: bun conformance/rvr-v0/adapter.ts --check

      - name: Run repository tests
        run: python -m unittest discover -s tests -p "test_*.py"

  rust-review-evidence:
    name: Frozen RC2 non-normative Rust review evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current reviewer source
        uses: actions/checkout@v7

      - name: Checkout frozen RC2 package
        uses: actions/checkout@v7
        with:
          ref: v0.0.1-rc.2
          path: rc2

      - name: Ensure Clippy is available
        run: rustup component add clippy

      - name: Run independent Rust reviewer
        run: >-
          cargo run --locked
          --manifest-path review/rc2-independent-rust/Cargo.toml
          -- --package-root rc2

      - name: Lint independent Rust reviewer
        run: >-
          cargo clippy --locked
          --manifest-path review/rc2-independent-rust/Cargo.toml
          --all-targets -- -D warnings

  erc8281-committed-receipt-profile:
    name: External profile — ERC-8281 committed receipt snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run exact external-profile gate
        run: python profiles/erc8281-committed-receipt-snapshot-v0/adapter.py --check

      - name: Run focused external-profile test
        run: python profiles/erc8281-committed-receipt-snapshot-v0/test_profile.py

  invinoveritas-signed-verdict-profile:
    name: External profile — invinoveritas signed verdict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run exact external-profile gate
        run: python profiles/invinoveritas-signed-verdict-v0/adapter.py --check

      - name: Run focused external-profile test
        run: python profiles/invinoveritas-signed-verdict-v0/test_profile.py
