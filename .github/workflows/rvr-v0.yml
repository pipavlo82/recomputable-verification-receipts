name: RVR v0 Conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rvr-v0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run exact RVR v0 gate
        run: python conformance/rvr-v0/adapter.py --check

      - name: Run repository tests
        run: python -m unittest discover -s tests -p "test_*.py"
