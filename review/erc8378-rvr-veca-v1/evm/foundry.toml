[profile.default]
src = "src"
out = "out"
libs = []
fs_permissions = [{ access = "read-write", path = "../gate-v2/runs" }]
allow_paths = ["../sources"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["token/=vendor/token/", "acp/=vendor/acp/", "@openzeppelin/contracts/=vendor/oz/", "@openzeppelin/contracts-upgradeable/=vendor/oz-up/", "forge-std/=vendor/forge-std/"]
